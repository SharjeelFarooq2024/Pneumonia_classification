base_config: configs/base.yaml
experiment: ablation_a1_resnet18_scratch
model:
  name: resnet18
  pretrained: false
  dropout: 0.0
  imagenet_normalization: true
training:
  batch_size: 16
  weight_decay: 0.0001
  loss: ce
  class_weights_from_subset: false
  label_smoothing: 0.0
  augment: false
  stages:
    - name: scratch_full
      epochs: 12
      lr: 0.001
      unfreeze: "all"
      scheduler: cosine
      weight_decay: 0.0001

