base_config: configs/base.yaml
experiment: ablation_a1_resnet18_frozen
model:
  name: resnet18
  pretrained: true
  dropout: 0.0
  imagenet_normalization: true
training:
  batch_size: 16
  weight_decay: 0.0
  loss: ce
  class_weights_from_subset: false
  label_smoothing: 0.0
  augment: false
  stages:
    - name: frozen
      epochs: 12
      lr: 0.001
      unfreeze: ["fc"]
      scheduler: cosine
      weight_decay: 0.0

