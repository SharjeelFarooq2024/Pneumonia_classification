project_name: p06-pneumonia-limited-data
experiment: baseline_smoke
seed: 42
data:
  root: data/raw
  dataset_id: pneumonia
  task_name: disease class
  num_classes: 3
  class_names:
  - NORMAL
  - BACTERIA
  - VIRUS
  image_size: 224
  splits_dir: data/splits
  subset_file: data/splits/train25_seed42.json
  num_workers: 0
  pin_memory: true
model:
  name: baseline_cnn
  pretrained: false
  input_channels: 3
  dropout: 0.0
  imagenet_normalization: false
training:
  epochs: 20
  batch_size: 8
  batch_size_fallbacks:
  - 64
  - 32
  - 16
  optimizer: adam
  lr: 0.001
  weight_decay: 0.0
  loss: ce
  focal_gamma: 2.0
  class_weights_from_subset: false
  label_smoothing: 0.0
  augment: false
  augment_params:
    rotation_deg: 10
    translate: 0.05
    scale_min: 0.95
    scale_max: 1.05
    brightness: 0.1
    contrast: 0.1
    random_resized_crop: false
    rrc_scale_min: 0.85
    rrc_scale_max: 1.0
    horizontal_flip: false
  mixup_alpha: 0.0
  cutmix_alpha: 0.0
  grad_clip: null
  amp: auto
  stages:
  - name: single
    epochs: 1
    lr: 0.001
    weight_decay: 0.0
    unfreeze: all
    scheduler: none
eval:
  batch_size: 64
  bootstrap_n: 1000
  bootstrap_seed: 42
paths:
  checkpoints: checkpoints
  results: results
  figures: results/figures
  logs: logs
logging:
  level: INFO
  save_predictions: true
